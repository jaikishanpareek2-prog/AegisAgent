name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          test -n "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 | head -1)"
          test -n "$SDKMANAGER"
          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDKMANAGER_DIR:$ANDROID_HOME/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager --version

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-34"
          sdkmanager --install "build-tools;34.0.0"
          sdkmanager --install "platform-tools"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --list_installed

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Unit tests
        run: ./gradlew test --stacktrace --no-daemon

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Assemble Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Verify APK artifacts
        run: |
          set -e
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          ls -lh "$DEBUG_APK" "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$DEBUG_APK" | head -30 || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: aegis-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
